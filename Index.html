<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JavaScript Demo</title>
</head>
<body>

<h2 id="output"></h2>

<script>
let fullName = "Nguyen Thi Thanh Van";
let studentId = "26A4042583";

let nameParts = fullName.toLowerCase().split(" ");

let initials = nameParts.slice(0, -1).map(n => n[0]).join("");

let firstName = nameParts[nameParts.length - 1];

let email = firstName + initials + "." + studentId + "@hvnh.edu.vn";

let coursePeriod = studentId.substring(0, 2); 
let faculty = studentId.substring(2, 3);    

let last4 = studentId.slice(-4);

let sum = 0;
for (let num of last4) {
  sum += Number(num);
}

document.getElementById("output").innerHTML = `
Email: ${email} <br><br>
Xin chào ${fullName}, bạn là sinh viên khóa ${coursePeriod}, 
khoa ${faculty}, tổng 4 số cuối trong mã sinh viên là ${sum}.
`;
</script>

</body>
</html>
